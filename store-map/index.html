<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BiteSpeed Mart – 3D Store Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛒%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1f2a37; --muted: #6b7684; --card: rgba(255,255,255,.88); --line: rgba(31,42,55,.10);
    --accent: #ff6b35; --accent-2: #ffb703;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe9f3; color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; }
  .panel { position: fixed; background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px rgba(31,42,55,.12); }
  #side { top: 16px; left: 16px; width: 340px; max-height: calc(100% - 32px); display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
  h1 small { font-weight: 600; color: var(--muted); font-size: 12px; }
  #q { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); font: inherit; font-size: 15px; outline: none; background: #fff; }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,107,53,.15); }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; transition: .15s; }
  .chip:hover { border-color: var(--accent); transform: translateY(-1px); }
  #results { overflow-y: auto; margin: 0 -6px; padding: 0 6px; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
  .res { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; background: transparent; font: inherit; text-align: left; color: inherit; }
  .res:hover, .res.on { background: #fff; border-color: var(--line); }
  .res .code { font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); padding: 3px 7px; border-radius: 7px; min-width: 46px; text-align: center; }
  .res .nm { font-size: 14px; font-weight: 600; }
  .res .sc { font-size: 11px; color: var(--muted); }
  #hint { color: var(--muted); font-size: 12px; padding: 6px 2px; }
  #info { left: 16px; bottom: 16px; width: 340px; padding: 14px 16px; display: none; }
  #info.show { display: block; }
  #info .t { font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  #info .m { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  #info button { margin-top: 10px; border: 0; background: var(--ink); color: #fff; border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  #tools { top: 16px; right: 16px; display: flex; gap: 6px; padding: 8px; }
  #tools button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  #tools button:hover { border-color: var(--accent); }
  #tools button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  .btn { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .res .price { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink); }
  .res .plus { border: 0; background: var(--accent); color: #fff; border-radius: 8px; width: 26px; height: 26px; font-size: 16px; line-height: 1; cursor: pointer; flex: none; }
  #cart { top: 84px; right: 16px; width: 320px; max-height: calc(100% - 200px); display: flex; flex-direction: column; gap: 10px; padding: 14px; }
  #cart h2 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  #scanrow { display: flex; gap: 6px; }
  #scan { flex: 1; min-width: 0; padding: 9px 11px; border-radius: 10px; border: 1.5px solid var(--line); font: inherit; font-size: 13px; outline: none; }
  #scan:focus { border-color: var(--accent); }
  #lines { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
  .line { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; padding: 6px 8px; border-radius: 10px; background: #fff; border: 1px solid var(--line); }
  .line .n { font-weight: 600; cursor: pointer; } .line .c { color: var(--muted); font-size: 11px; }
  .qty { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .qty button { width: 22px; height: 22px; border-radius: 7px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 14px; line-height: 1; }
  .tot { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .tot.big { font-size: 17px; font-weight: 800; color: var(--ink); }
  #empty { color: var(--muted); font-size: 12px; text-align: center; padding: 10px; }
  #cam { position: fixed; inset: 0; background: rgba(15,20,28,.8); display: none; place-items: center; z-index: 20; }
  #cam.show { display: grid; } #cam .box { background: #fff; border-radius: 18px; padding: 14px; width: min(440px, 92vw); text-align: center; }
  #cam video { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 4/3; object-fit: cover; }
  #flash { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); background: #27b24f; color: #fff; padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; z-index: 30; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #flash.show { opacity: 1; }
  #pay { position: fixed; inset: 0; background: rgba(15,20,28,.55); display: none; place-items: center; z-index: 25; }
  #pay.show { display: grid; }
  #pay .box { background: #fff; border-radius: 20px; padding: 20px; width: min(420px, 92vw); max-height: 90vh; overflow: auto; }
  #pay h3 { margin: 0 0 10px; } .methods { display: flex; gap: 8px; margin: 12px 0; } .methods button { flex: 1; padding: 12px 6px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font: inherit; font-size: 13px; cursor: pointer; }
  .methods button.on { border-color: var(--accent); background: #fff3ed; font-weight: 700; }
  .rline { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .ok { text-align: center; } .ok .tick { font-size: 46px; }
  #chatbtn { left: 50%; transform: translateX(-50%); bottom: 16px; padding: 12px 16px; font-weight: 700; cursor: pointer; border: 1px solid var(--line); font: inherit; font-weight: 700; color: var(--ink); }
  #chat { left: 50%; transform: translateX(-50%); bottom: 16px; width: 380px; height: 330px; display: none; flex-direction: column; padding: 12px; gap: 8px; }
  #chat.show { display: flex; }
  #chat header { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 14px; }
  #chat header span small { font-weight: 600; color: var(--muted); font-size: 11px; display: block; }
  #msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .m { max-width: 86%; padding: 8px 11px; border-radius: 14px; font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
  .m.u { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .m.a { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  #chatform { display: flex; gap: 6px; } #chatq { flex: 1; min-width: 0; padding: 9px 11px; border-radius: 10px; border: 1.5px solid var(--line); font: inherit; font-size: 13px; outline: none; }
  #tip { position: fixed; pointer-events: none; padding: 6px 10px; border-radius: 10px; background: rgba(31,42,55,.92); color: #fff; font-size: 12px; line-height: 1.4; display: none; transform: translate(12px, 12px); z-index: 5; white-space: nowrap; }
  #tip b { font-size: 13px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #dfe9f3; font-weight: 700; color: var(--muted); z-index: 10; transition: opacity .5s; }
  #loading.hide { opacity: 0; pointer-events: none; }
  @media (max-width: 760px) {
    #side { width: auto; right: 16px; max-height: 46%; }
    #info { width: auto; right: 16px; }
    #tools { display: none; }
    #cart { top: auto; bottom: 70px; width: auto; left: 16px; max-height: 40%; }
    #chat { width: auto; left: 16px; right: 16px; transform: none; }
  }
</style>

<body>
<div id="loading">Stocking the shelves…</div>

<div id="side" class="panel">
  <h1>🛒 BiteSpeed Mart <small id="count"></small></h1>
  <input id="q" type="search" placeholder="Search a product or code (e.g. sugar, 2A17)…" autocomplete="off">
  <div id="chips"></div>
  <div id="results"></div>
</div>

<div id="info" class="panel">
  <div class="t"><span id="i-name"></span><span id="i-code" style="font-size:12px;color:var(--accent)"></span></div>
  <div class="m" id="i-meta"></div>
  <button id="i-add" style="background:var(--accent)">+ Add to cart</button> <button id="i-clear">Clear route</button>
</div>

<div id="tools" class="panel">
  <button id="b-rotate">⟳ Auto-rotate</button>
  <button id="b-top">⬒ Top view</button>
  <button id="b-reset">⌂ Reset</button>
</div>

<div id="cart" class="panel">
  <h2><span>🧾 My cart <small id="ccount" style="color:var(--muted);font-weight:600"></small></span><button class="btn ghost" id="cclear" style="padding:4px 9px;font-size:11px">Clear</button></h2>
  <div id="scanrow"><input id="scan" placeholder="Scan / type barcode or code…" autocomplete="off"><button class="btn" id="camBtn" title="Scan with camera">📷</button></div>
  <div id="lines"></div>
  <div class="tot"><span>Subtotal</span><span id="csub">₹0</span></div>
  <div class="tot big"><span>Total</span><span id="ctot">₹0</span></div>
  <button class="btn" id="checkout" disabled>Checkout</button>
</div>
<div id="cam"><div class="box"><video id="camv" playsinline muted></video><p style="font-size:13px;color:var(--muted)">Point the camera at a product barcode</p><button class="btn ghost" id="camClose">Close</button></div></div>
<div id="pay"><div class="box" id="paybox"></div></div>
<div id="flash"></div>
<button id="chatbtn" class="panel">💬 Ask the store assistant</button>
<div id="chat" class="panel">
  <header><span>🤖 Store assistant<small id="mode"></small></span><button class="btn ghost" id="chatx" style="padding:3px 9px">✕</button></header>
  <div id="msgs"></div>
  <form id="chatform"><input id="chatq" placeholder="e.g. where is the sugar?" autocomplete="off"><button class="btn">Send</button></form>
</div>
<div id="tip"></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';

/* ---------- data ---------- */
const [layout, products] = await Promise.all([
  fetch('data/store-layout.json').then(r => r.json()),
  fetch('data/products.json').then(r => r.json()),
]);
const secById = Object.fromEntries(layout.sections.map(s => [s.id, s]));
const byCode = Object.fromEntries(products.map(p => [p.code, p]));
document.getElementById('count').textContent = `${products.length} products`;

/* ---------- helpers ---------- */
const CX = layout.map.originX + layout.map.width / 2, CZ = layout.map.originY + layout.map.height / 2;
const px2x = v => (v - CX) / 10, px2z = v => (v - CZ) / 10;
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#dfe9f3');
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);
const HOME = { pos: new THREE.Vector3(-14, 90, 104), target: new THREE.Vector3(-14, 0, 4) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 12; controls.maxDistance = 190;
controls.autoRotateSpeed = 0.8;

scene.add(new THREE.HemisphereLight('#ffffff', '#c9b79c', 1.35));
const sun = new THREE.DirectionalLight('#fff4e0', 2.0);
sun.position.set(-40, 80, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 55, bottom: -55, near: 10, far: 220 });
sun.shadow.bias = -0.0004;
scene.add(sun);

const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .75, metalness: 0, ...o });
function box(w, h, d, mat, x, y, z, parent = scene, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}

/* ---------- floor + walls ---------- */
const MW = layout.map.width / 10, MH = layout.map.height / 10;
{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); g.fillStyle = '#f0e3b8'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#ead9a8'; g.fillRect(0, 0, 64, 64); g.fillRect(64, 64, 64, 64);
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(MW / 3, MH / 3); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const floor = new THREE.Mesh(new THREE.BoxGeometry(MW, 1, MH), [0, 1, 2, 3, 4, 5].map(i => i === 2 ? new THREE.MeshStandardMaterial({ map: tex, roughness: .9 }) : std('#c9b588')));
  floor.position.y = -0.5; floor.receiveShadow = true; scene.add(floor);
  const base = new THREE.Mesh(new THREE.BoxGeometry(MW + 6, 1.2, MH + 6), std('#b7c4d4'));
  base.position.y = -1.6; base.receiveShadow = true; scene.add(base);
  const wallMat = std('#fbf7ee'), t = 0.8, wh = 1.4;
  box(MW + t, wh, t, wallMat, 0, wh / 2, -MH / 2 - t / 2 + .1);          // back
  box(t, wh, MH, wallMat, -MW / 2 - t / 2, wh / 2, 0);                   // left
  box(t, wh, MH, wallMat, MW / 2 + t / 2, wh / 2, 0);                    // right
  // front wall with door gaps (entry & exit)
  const gaps = ['entry', 'exit', 'cart'].map(k => layout.doors[k].rect).filter((_, i) => i < 2).map(r => [px2x(r.x), px2x(r.x + r.w)]).sort((a, b) => a[0] - b[0]);
  let cur = -MW / 2;
  for (const [a, b] of [...gaps, [MW / 2, MW / 2]]) {
    if (a > cur) box(a - cur, wh, t, wallMat, (a + cur) / 2, wh / 2, MH / 2 + t / 2 - .1);
    cur = b;
  }
}

/* ---------- label sprites ---------- */
function labelSprite(text, { icon = '', badge = '', bg = '#ffffff', fg = '#1f2a37', scale = 1 } = {}) {
  const c = document.createElement('canvas'); c.width = 640; c.height = 160;
  const g = c.getContext('2d');
  g.font = '700 54px ui-rounded, "Nunito", system-ui, sans-serif';
  const label = (icon ? icon + ' ' : '') + text;
  const tw = g.measureText(label).width, bw = badge ? 90 : 0;
  const w = Math.min(620, tw + 70 + bw), x0 = (640 - w) / 2;
  g.fillStyle = 'rgba(31,42,55,.18)'; g.beginPath(); g.roundRect(x0 + 4, 26, w, 100, 50); g.fill();
  g.fillStyle = bg; g.beginPath(); g.roundRect(x0, 18, w, 100, 50); g.fill();
  if (badge) { g.fillStyle = '#ff6b35'; g.beginPath(); g.roundRect(x0 + 12, 30, 76, 76, 38); g.fill();
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '800 38px ui-rounded, system-ui, sans-serif'; g.fillText(badge, x0 + 50, 70); }
  g.fillStyle = fg; g.font = '700 54px ui-rounded, "Nunito", system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(label, x0 + bw + (w - bw) / 2, 70);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(11 * scale, 2.75 * scale, 1); return s;
}

/* ---------- sections: shelves + products ---------- */
const productMeshes = [];           // for raycasting
const productInfo = new Map();      // code -> {mesh, pos(Vector3), walk:{x,y}, row, col}
const sectionGroups = {};
const floatingSigns = [];

function buildSection(sec) {
  const r = sec.rect, vertical = sec.facing === 'left' || sec.facing === 'right';
  const sx = r.w / 10, sz = r.h / 10;
  const H = sec.id === 'seafood' ? 2.6 : sec.id === 'bakery' ? 2.8 : vertical ? 3.8 : 4.4;
  const cx = px2x(r.x + r.w / 2), cz = px2z(r.y + r.h / 2);
  const group = new THREE.Group(); group.position.set(cx, 0, cz); scene.add(group); sectionGroups[sec.id] = group;
  const dir = { left: [-1, 0], right: [1, 0], down: [0, 1] }[sec.facing];
  const body = box(sx, H, sz, std(sec.fridge ? '#7fb6cf' : sec.color, { roughness: .6 }), 0, H / 2, 0, group);
  box(sx + .15, .25, sz + .15, std(sec.fridge ? '#e6f6fb' : '#c98f68'), 0, H + .12, 0, group);   // cap

  const len = vertical ? sz : sx, margin = .5, cellL = (len - 2 * margin) / sec.cols;
  const tierH = (H - .5) / sec.tiers, ledgeD = .62, prodD = .46;
  const ledgeMat = std(sec.fridge ? '#f4fbff' : '#f8efe4');
  const list = products.filter(p => p.section === sec.id);
  for (let t = 0; t < sec.tiers; t++) {
    const y = .32 + (sec.tiers - 1 - t) * tierH;
    const ledge = new THREE.Mesh(new THREE.BoxGeometry(vertical ? ledgeD : len, .1, vertical ? len : ledgeD), ledgeMat);
    ledge.position.set(dir[0] * (sx / 2 + ledgeD / 2) * (vertical ? 1 : 0), y, dir[1] * (sz / 2 + ledgeD / 2) * (vertical ? 0 : 1));
    ledge.receiveShadow = ledge.castShadow = true; group.add(ledge);
  }
  const geoms = [new THREE.BoxGeometry(1, 1, 1), new THREE.CylinderGeometry(.5, .5, 1, 14)];
  for (const p of list) {
    const t = Math.floor(p.slot / sec.cols), c = p.slot % sec.cols, h = hash(p.name);
    const hue = (h % 360) / 360, color = new THREE.Color().setHSL(hue, .55 + (h >> 8) % 25 / 100, .58 + (h >> 12) % 14 / 100);
    const bh = tierH * (.5 + (h >> 4) % 25 / 100), bl = cellL * .72;
    const shape = (h >> 3) % 3 === 0 ? 1 : 0;
    const m = new THREE.Mesh(geoms[shape], std(color, { roughness: .55 }));
    const yb = .32 + (sec.tiers - 1 - t) * tierH + .05 + bh / 2;
    const along = -len / 2 + margin + (c + .5) * cellL;
    const off = (vertical ? sx : sz) / 2 + (shape ? ledgeD : ledgeD) / 2;
    const w = vertical ? [prodD, bh, bl] : [bl, bh, prodD];
    if (shape) { const d = Math.min(prodD, bl) * 1; m.scale.set(d, bh, d); } else m.scale.set(...w);
    m.position.set(vertical ? dir[0] * off : along, yb, vertical ? along : dir[1] * off);
    m.castShadow = true; m.receiveShadow = true; m.userData.code = p.code; m.userData.base = m.scale.clone(); m.userData.baseColor = color.clone();
    group.add(m); productMeshes.push(m);
    const wp = m.getWorldPosition(new THREE.Vector3());
    const pxAlong = vertical ? r.y + (margin + (c + .5) * cellL) * 10 : r.x + (margin + (c + .5) * cellL) * 10;
    productInfo.set(p.code, { mesh: m, pos: wp, row: t + 1, col: c + 1, topY: H,
      walk: vertical ? { x: sec.walk, y: pxAlong } : { x: pxAlong, y: sec.walk } });
  }
  // floating sign
  const sign = labelSprite(sec.label, { icon: sec.icon, badge: sec.number });
  const sp = vertical ? new THREE.Vector3(cx, H + 3.2, cz + (sec.id === 'seafood' || sec.id === 'bakery' ? 0 : -sz / 2 + 2)) : new THREE.Vector3(cx, H + 3, cz + 5.5);
  sign.position.copy(sp); sign.userData.baseY = sp.y; sign.userData.phase = hash(sec.id) % 6; scene.add(sign); floatingSigns.push(sign);
}
layout.sections.forEach(buildSection);

/* ---------- doors & cart bay ---------- */
const doorPanels = [];
function buildDoor(key, label) {
  const d = layout.doors[key], r = d.rect, w = r.w / 10, cx = px2x(r.x + r.w / 2), z = px2z(r.y);
  box(w, .12, r.h / 10, std(d.color, { roughness: .9 }), cx, .06, px2z(r.y + r.h / 2), scene, false);   // floor mat
  const glass = new THREE.MeshStandardMaterial({ color: '#bfe9ff', transparent: true, opacity: .45, roughness: .1 });
  const L = box(w / 2, 3.2, .18, glass, cx - w / 4, 1.6, px2z(r.y + r.h - 2), scene, false);
  const R = box(w / 2, 3.2, .18, glass, cx + w / 4, 1.6, px2z(r.y + r.h - 2), scene, false);

    const j = await r.json(); wait.textContent = j.reply; history = j.messages || history;
    try { sessionStorage.setItem('bsm-chat', JSON.stringify(history)); } catch {}
    $('mode').textContent = j.mode === 'claude' ? 'powered by Claude' : 'offline mode (no API key)';
    for (const a of j.actions || []) { if (a.type === 'add') addToCart(a.code, a.qty, true); if (a.type === 'route') selectProduct(a.code); }
  } catch { wait.textContent = 'The assistant needs the Node server – run `npm start` in store-map (see README) instead of a plain static server.'; }
  $('msgs').scrollTop = 1e9;
};

document.getElementById('loading').classList.add('hide');
const qs = new URLSearchParams(location.search).get('item'); if (qs && byCode[qs.toUpperCase()]) selectProduct(qs.toUpperCase());
window.__store = { addToCart, openPay, selectProduct, clearRoute, camera, controls, scene, productInfo };
</script>
</body>
</html>
