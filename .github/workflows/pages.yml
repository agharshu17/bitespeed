# Publishes the BiteSpeed Mart app (the store-map folder) as a website on GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions". Runs on every push to main, or by hand from the Actions tab.
name: Deploy app to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['store-map/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep only the files the site needs
        run: |
          mkdir -p _site
          cd store-map
          cp -r index.html sw.js manifest.webmanifest icons js data vendor assets ../_site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
